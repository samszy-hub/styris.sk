<!-- Meta Pixel Code (spúšťa sa až po súhlase s cookies) -->
<script>
(function(){
  function loadMetaPixel(){
    if(window.fbq && window.fbq.loaded) return;
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1109649517577215');
    fbq('track', 'PageView');
  }
  window.__loadMetaPixel = loadMetaPixel;
  try {

</script>

<!-- Cookie consent -->
<style>
  #cookiebar{position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-end;justify-content:center;
    padding:20px;font-family:'Montserrat',system-ui,sans-serif;
    background:rgba(10,10,10,.55);backdrop-filter:blur(3px);animation:ccFade .3s ease forwards}
  #cookiebar[hidden]{display:none}
  @keyframes ccFade{from{opacity:0}to{opacity:1}}
  #cookiebar .cc-inner{max-width:820px;width:100%;background:#1A1A1A;color:#fff;
    border-radius:20px;box-shadow:0 30px 70px rgba(0,0,0,.5);padding:30px 32px;
    display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;
    transform:translateY(16px);opacity:0;animation:ccUp .45s .05s var(--ease,cubic-bezier(.16,1,.3,1)) forwards}
  @keyframes ccUp{to{transform:translateY(0);opacity:1}}
  #cookiebar .cc-text{flex:1 1 340px;font-size:.95rem;line-height:1.6;color:rgba(255,255,255,.82)}
  #cookiebar .cc-text strong{color:#fff;font-weight:800;display:block;margin-bottom:8px;font-size:1.3rem;letter-spacing:-.01em}
  #cookiebar .cc-text a{color:#F4C20D;text-decoration:underline}
  #cookiebar .cc-btns{display:flex;gap:12px;flex:0 0 auto}
  #cookiebar button{font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
    border-radius:12px;padding:15px 28px;border:1px solid transparent;transition:all .18s ease;white-space:nowrap}
  #cookiebar .cc-no{background:transparent;color:rgba(255,255,255,.78);border-color:rgba(255,255,255,.3)}
  #cookiebar .cc-no:hover{color:#fff;border-color:rgba(255,255,255,.6)}
  #cookiebar .cc-yes{background:#F4C20D;color:#1A1A1A;box-shadow:0 8px 24px rgba(244,194,13,.35)}
  #cookiebar .cc-yes:hover{background:#ffd028;transform:translateY(-1px)}
  @media(max-width:620px){
    #cookiebar{align-items:center;padding:18px}
    #cookiebar .cc-inner{padding:30px 26px;gap:24px;border-radius:24px}
    #cookiebar .cc-text{flex:1 1 100%;font-size:1.02rem}
    #cookiebar .cc-text strong{font-size:1.45rem;margin-bottom:12px}
    #cookiebar .cc-btns{flex:1 1 100%;flex-direction:column-reverse}
    #cookiebar button{flex:1;width:100%;padding:17px 28px;font-size:1.02rem}
  }
</style>
<div id="cookiebar" hidden>
  <div class="cc-inner">
    <div class="cc-text">
      <strong>Používame súbory cookies</strong>
      Na meranie návštevnosti a účinnosti reklamy používame Meta Pixel, ktorý ukladá súbory cookies. Spustíme ho <strong style="display:inline;font-size:inherit">len s vaším súhlasom</strong>. Bez súhlasu stránka funguje normálne, len bez merania. Viac v dokumente <a href="GDPR.html">Ochrana osobných údajov</a>.
    </div>
    <div class="cc-btns">
      <button class="cc-no" type="button" onclick="window.__cookieChoice(false)">Odmietnuť</button>
      <button class="cc-yes" type="button" onclick="window.__cookieChoice(true)">Súhlasím</button>
    </div>
  </div>
</div>
<script>
(function(){
  var KEY = 'styris_cookie_consent';
  var bar = document.getElementById('cookiebar');
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e) {}
  if(!saved) bar.hidden = false;
  window.__cookieChoice = function(granted){
    try { localStorage.setItem(KEY, granted ? 'granted' : 'denied'); } catch(e) {}
    bar.hidden = true;
    if(granted && typeof window.__loadMetaPixel === 'function') window.__loadMetaPixel();
  };
})();
</script>
</body>
